version: '3.8'

services:
  # 1. PostgreSQL Persistent Relational Identity Store
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_secure_password_2026
      POSTGRES_DB: nexus_identity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_identity"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  # 2. Redis Distributed Rate Limiter & Security State
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus-network

  # 3. Go Core Authentication & Policy Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://nexus:nexus_secure_password_2026@postgres:5432/nexus_identity?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SIGNING_KEY: nexus_production_jwt_signing_secret_key_2026_change_in_prod
      DEV_SEED: "true"
      CORS_ORIGIN: "http://localhost:3000,http://localhost:5173"
    networks:
      - nexus-network

  # 4. React + TypeScript Security Dashboard (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - nexus-network

volumes:
  postgres_data:
    driver: local

networks:
  nexus-network:
    driver: bridge
