name: NEXUS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Go Backend Tests & Build
  backend-test:
    name: Go Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Install Dependencies
        working-directory: backend
        run: go mod download

      - name: Run Go Unit Tests & RBAC Checks
        working-directory: backend
        env:
          JWT_SIGNING_KEY: test_github_actions_secret_key_32_bytes_long
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build Go Binary
        working-directory: backend
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/server

  # Job 2: Python TOTP Security Utility Tests
  python-test:
    name: Python RFC 6238 TOTP Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Pytest Test Suite
        run: python -m pytest security/tests -v

  # Job 3: Frontend Type Check & Build
  frontend-test:
    name: React + TypeScript Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: TypeScript Compile & Vite Build
        working-directory: frontend
        run: npm run build

  # Job 4: Docker Container Build Verification
  docker-build:
    name: Docker Container Image Build
    runs-on: ubuntu-latest
    needs: [backend-test, python-test, frontend-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: nexus-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: nexus-frontend:test
